name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Game-independent: compiles the core logic and runs the unit tests. Game API checks
  # skip themselves because hosted runners have no Stationeers install (and game
  # assemblies must not be committed or downloaded from unofficial sources).
  core-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build tests
        run: dotnet build tests/FasterFrameFinishing.Tests/FasterFrameFinishing.Tests.csproj -c Release
      - name: Run tests
        run: dotnet test --project tests/FasterFrameFinishing.Tests/FasterFrameFinishing.Tests.csproj -c Release --no-build

  # Full plugin build + game API compatibility tests. Requires a self-hosted Windows runner
  # with Stationeers and BepInEx 5 installed, and STATIONEERS_DIR set on the runner.
  # Enable by setting the repository variable STATIONEERS_SELF_HOSTED to 'true'.
  plugin:
    if: ${{ vars.STATIONEERS_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Build solution
        run: dotnet build FasterFrameFinishing.sln -c Release
      - name: Run all tests (including game API checks)
        run: dotnet test --solution FasterFrameFinishing.sln -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: FasterFrameFinishing
          path: src/FasterFrameFinishing/bin/Release/package/
