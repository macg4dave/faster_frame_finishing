[Frame Finishing]

## Master switch. false = vanilla finishing time (the mod changes nothing). Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: true
Enabled = true

## How much faster the plastic-sheet + screwdriver finishing stage of steel frames is. 1.0 = vanilla, 5.0 = five times faster (vanilla 2.0 s becomes 0.4 s before tool-speed modifiers). Values below 1.0 slow it down. Durations never go below 0.05 s. Changes take effect after restarting the game.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.1 to 100
SpeedMultiplier = 5

## If true, finishing completes almost instantly regardless of SpeedMultiplier. You still use the screwdriver and plastic sheet as normal. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: false
InstantFinish = false

## Log every steel-frame prefab's build states and matching decisions to the BepInEx log. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: false
DebugLogging = false

