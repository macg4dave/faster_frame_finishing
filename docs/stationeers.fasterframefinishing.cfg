[Frame Finishing]

## Master switch. Off = normal (vanilla) finishing time; the mod changes nothing. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: true
Enabled = true

## How many times faster the plastic-sheet + screwdriver finishing step of steel frames is: 2x, 3x, 4x, 5x or 10x. 5x (default) turns 2.0 s into 0.4 s. For normal speed, turn Enabled off. Changes take effect after restarting the game.
# Setting type: SpeedMultiplierOption
# Default value: x5
# Acceptable values: x2, x3, x4, x5, x10
SpeedMultiplier = x5

## Finish frames almost instantly, whatever the Speed Multiplier. You still use the screwdriver and plastic sheet as normal. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: false
InstantFinish = false

## Log every steel-frame prefab's build states and matching decisions to the BepInEx log. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: false
DebugLogging = false

