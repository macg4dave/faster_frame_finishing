[Frame Finishing]

## Master switch. Off = normal (vanilla) finishing time; the mod changes nothing. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: true
Enabled = true

## How many times faster welding sheets onto iron and steel frames, and the plastic-sheet finishing step on steel frames, are: 2x, 3x, 4x, 5x or 10x. At 5x (default), each welding step takes 0.2 s instead of 1.0 s, and finishing takes 0.4 s instead of 2.0 s. Placing frames and taking them apart are unchanged. For normal speed, turn Enabled off. Changes take effect after restarting the game.
# Setting type: SpeedMultiplierOption
# Default value: x5
# Acceptable values: x2, x3, x4, x5, x10
SpeedMultiplier = x5

## Make welding and finishing frames almost instant, whatever the Speed Multiplier. You still use the welder, sheets, screwdriver and plastic as normal. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: false
InstantFinish = false

## Log every frame prefab's build states and matching decisions to the BepInEx log. Changes take effect after restarting the game.
# Setting type: Boolean
# Default value: false
DebugLogging = false

